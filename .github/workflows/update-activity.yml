name: Update Repository Activity

on:
  push:
    branches:
      - "**"
      - "!SmartWebServer-Original"
  workflow_dispatch:
  schedule:
    - cron: "15 0 * * *"

concurrency:
  group: repository-activity-pages
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  build:
    name: Generate activity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout statistics generator
        uses: actions/checkout@v6
        with:
          ref: SmartWebServer-FeatureRelease
          fetch-depth: 0

      - name: Fetch all repository branches
        run: |
          git fetch --no-tags origin "+refs/heads/*:refs/remotes/origin/*" --prune
          git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/'

      - name: Fetch upstream project
        run: |
          git remote add upstream https://github.com/hjd1964/SmartWebServer.git
          git fetch --no-tags upstream "+refs/heads/main:refs/remotes/upstream/main"

      - name: Generate repository activity
        env:
          ACTIVITY_TIMEZONE: Asia/Shanghai
          ACTIVITY_BASE_BRANCH: SmartWebServer-FeatureRelease
          ACTIVITY_ORIGINAL_BRANCH: SmartWebServer-Original
          ACTIVITY_BRANCH_PATTERN: "*"
          ACTIVITY_UPSTREAM_BRANCH: main
        run: python3 .github/scripts/update_activity.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy activity
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
